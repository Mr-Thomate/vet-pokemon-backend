# Para probar el contenedor en tu PC ANTES de subir a Render:
#   docker compose up --build
# Levanta un Postgres local (no toca tu base de Neon) y la API en http://localhost:8080
services:
  postgres-db:
    image: postgres:16
    container_name: vet-postgres
    environment:
      POSTGRES_DB: vetdb
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: vet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet -d vetdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  vet-backend:
    build: ./vet-backend
    container_name: vet-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/vetdb
      DB_USERNAME: vet
      DB_PASSWORD: vet
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres-db:
        condition: service_healthy
